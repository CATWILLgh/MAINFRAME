name: Feature request
description: Propose a portable addition or improvement to MAINFRAME.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent workflow is difficult, unreliable, or missing today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why it belongs in MAINFRAME
      description: Explain why this should be shared product behavior instead of project-local guidance.
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: Product portability
      description: Which agent products or interfaces should support it, and where may native adaptation be required?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds, existing components, or simpler boundaries you considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and delivered components for this capability.
          required: true
        - label: This request contains no secrets, credentials, or private session data.
          required: true
