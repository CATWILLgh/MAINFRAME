name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hook analyzer dependencies
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.15.15 semgrep==1.164.0 yamllint==1.38.0
          npm install --global --no-audit --no-fund oxlint@1.67.0 fallow@2.92.1
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from installer.runtime import CODE_QUALITY_TOOLS, TOOL_SPECS, ensure

          home = Path(os.environ["RUNNER_TEMP"]) / "mainframe"
          required = tuple(name for name in CODE_QUALITY_TOOLS if TOOL_SPECS[name][0] == "release")
          ready = ensure(home, required)
          with Path(os.environ["GITHUB_PATH"]).open("a", encoding="utf-8") as path:
              print(ready["bin"], file=path)
          PY

      - name: Validate repository structure
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test hooks
        run: |
          rustfmt --version
          python3 -B -m unittest discover -s hooks/tests -p 'test_*.py'

      - name: Test credential helper
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s shared/credentials/tests -p 'test_*.py'

      - name: Check shell syntax
        run: bash -n shared/credentials/mainframe-secret shared/credentials/install.sh

      - name: Check changed whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff-tree --check --no-commit-id -r "${{ github.sha }}"
          fi
