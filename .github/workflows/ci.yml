name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests + validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Installer lifecycle planner tests
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...

      # Two hook tests build throwaway git repos; a runner has git but no identity.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@mainframe.local"
          git config --global user.name "mainframe-ci"

      # Most hook tests drive each hook with stdlib + fixtures/stubs and never
      # shell out to the network-bound linters (oxlint/semgrep/fallow). The
      # python-security-scan delta tests are the exception — they exercise the
      # real `ruff` integration (a fast, deterministic local binary), so ruff is
      # installed here, before the suite runs.
      - name: Install ruff (Python security scanner)
        # Pinned to the version the delta tests were verified against, so a future
        # ruff rule/output change can't turn CI red without a deliberate bump.
        run: pip install ruff==0.15.15

      - name: Hook test suite
        run: |
          fail=0
          for t in tools/test_*.py; do
            # test_build_hub_page / test_build_opencode(_config) / test_build_codex /
            # test_render_core / test_render_reminder / test_validate_skill need
            # pyyaml (the last also tiktoken); they run after Validator dependencies.
            [ "$t" = "tools/test_build_hub_page.py" ] && continue
            [ "$t" = "tools/test_build_opencode.py" ] && continue
            [ "$t" = "tools/test_build_opencode_config.py" ] && continue
            [ "$t" = "tools/test_build_codex.py" ] && continue
            [ "$t" = "tools/test_render_core.py" ] && continue
            [ "$t" = "tools/test_render_reminder.py" ] && continue
            [ "$t" = "tools/test_validate_skill.py" ] && continue
            echo "::group::$t"
            python3 "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Validator dependencies
        run: pip install tiktoken pyyaml

      # ADR 0085: core/ + adapters/ are the source of truth; dist/ is a
      # committed render output. The test suites exercise rendered files, so
      # this check is the sole guard against un-rendered core edits. Needs
      # pyyaml (agents section), hence it runs after Validator dependencies.
      - name: Neutral-core render check
        run: python3 tools/render_core.py --check

      - name: Neutral-core render tests
        run: |
          python3 tools/test_render_core.py
          python3 tools/test_render_reminder.py

      - name: Skill validator tests
        run: python3 tools/test_validate_skill.py

      # Both generators parse YAML frontmatter, so their tests need pyyaml
      # (installed just above) — unlike the stdlib-only hook tests.
      - name: Hub page generator tests
        run: python3 tools/test_build_hub_page.py

      - name: OpenCode projection generator tests
        run: |
          python3 tools/test_build_opencode.py
          python3 tools/test_build_opencode_config.py

      - name: Codex projection generator tests
        run: python3 tools/test_build_codex.py

      # The dispatcher plugin is plain ESM JS precisely so stock node (present
      # on the runner) can test it — the Bun shell is faked inside the test.
      - name: OpenCode gates dispatcher tests
        run: node tools/test_mainframe_gates.mjs

      - name: Validate skills
        run: python3 tools/validate-skill.py --all

      # Root CLAUDE.md is gitignored (not in the checkout); validate the shipped one.
      - name: Validate umbrella CLAUDE.md
        run: python3 tools/validate-claude-md.py dist/claude-code/CLAUDE.md
