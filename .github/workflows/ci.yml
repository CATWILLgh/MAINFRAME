name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Trace synthetic credential registration
        shell: bash
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
          trace_root=$(mktemp -d)
          for attempt in $(seq 1 8); do
            trace_prefix="$trace_root/$attempt"
            if PYTHONPATH=shared/credentials/tests strace -ff -qq -ttt -s 256 \
                -e trace=open,openat,creat,unlink,unlinkat,mkdir,mkdirat,rmdir,rename,renameat,renameat2,kill,chdir,write \
                -o "$trace_prefix" python3 -B -m unittest \
                test_secret.SecretCommandTests.test_parallel_registration_converges_without_lost_entries; then
              continue
            fi
            python3 - "$trace_prefix" <<'TRACE'
          from pathlib import Path
          import sys

          prefix = Path(sys.argv[1])
          events = []
          for path in prefix.parent.glob(prefix.name + ".*"):
              pid = path.suffix[1:]
              for line in path.read_text(errors="replace").splitlines():
                  if any(item in line for item in ("/config/credentials", '"pid"', "kill(", "registered 'TOKEN_")):
                      timestamp, syscall = line.split(maxsplit=1)
                      events.append((timestamp, pid, syscall))
          for timestamp, pid, syscall in sorted(events):
              print(timestamp, pid, syscall)
          TRACE
            exit 1
          done

      - name: Install hook analyzer dependencies
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.15.15 semgrep==1.164.0
          npm install --global --no-audit --no-fund oxlint@1.67.0 fallow@2.92.1

      - name: Validate repository structure
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test hooks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s hooks/tests -p 'test_*.py'

      - name: Test credential helper
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s shared/credentials/tests -p 'test_*.py'

      - name: Check shell syntax
        run: bash -n shared/credentials/mainframe-secret shared/credentials/install.sh

      - name: Check changed whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff-tree --check --no-commit-id -r "${{ github.sha }}"
          fi
