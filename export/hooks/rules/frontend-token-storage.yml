rules:
  - id: hub-token-in-web-storage
    message: >-
      Storing authentication tokens in localStorage / sessionStorage exposes
      them to XSS attacks — any injected script reads the entire storage
      synchronously. Use httpOnly cookies (server-set, not JS-accessible) for
      refresh tokens; keep access tokens in memory if at all possible. Per OWASP
      DOM-based XSS Prevention Cheat Sheet.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: "CWE-922: Insecure Storage of Sensitive Information"
      owasp: "A02:2021 Cryptographic Failures"
      source: hub-react-frontend-patterns/safety.md
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem("$KEY", ...)
          - pattern: localStorage.setItem('$KEY', ...)
          - pattern: sessionStorage.setItem("$KEY", ...)
          - pattern: sessionStorage.setItem('$KEY', ...)
          - pattern: window.localStorage.setItem("$KEY", ...)
          - pattern: window.localStorage.setItem('$KEY', ...)
          - pattern: window.sessionStorage.setItem("$KEY", ...)
          - pattern: window.sessionStorage.setItem('$KEY', ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i).*(token|jwt|bearer|\bauth|sessionid|apikey|api_key|secret|credential).*'
